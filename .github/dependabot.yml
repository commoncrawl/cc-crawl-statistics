version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "hyperloglog"
        # needs to stay on 0.0.14 to avoid serialization errors, see #15
        versions: [ ">0.0.14" ]

  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
